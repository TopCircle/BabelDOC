name: Checks

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    name: Package and lightweight PDF smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache BabelDOC assets
        uses: actions/cache@v5
        with:
          path: ~/.cache/babeldoc
          key: babeldoc-assets-${{ hashFiles('babeldoc/assets/embedding_assets_metadata.py') }}

      - name: Setup uv with Python 3.12
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          activate-environment: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Build package
        run: uv build

      - name: Import and CLI smoke
        run: |
          uv run python -m compileall babeldoc
          uv run babeldoc --help
          uv run python -m babeldoc.tools.dual_quality_check --self-check

      # Unit tests only — large dual PDFs under tests/ are data, not test modules.
      # Fonts may be absent on fresh runners; tests that need them skip via skipif.
      - name: Unit tests
        run: uv run pytest tests/ -q --tb=short

      - name: Lightweight no-secret PDF E2E
        run: |
          uv run babeldoc \
            --openai \
            --openai-api-key ci-dummy-key \
            --files examples/ci/test.pdf \
            --only-parse-generate-pdf \
            --skip-scanned-detection

  # Optional layout regression gate (Layout-First P0, design doc §2):
  # workflow_dispatch or a PR carrying the `layout` label only. Reuses the
  # same assets cache as `checks`; runs the synthetic-page digest against the
  # committed golden and fails on Δ≠0. Not part of the default CI path.
  layout-repro:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'layout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache BabelDOC assets
        uses: actions/cache@v5
        with:
          path: ~/.cache/babeldoc
          key: babeldoc-assets-${{ hashFiles('babeldoc/assets/embedding_assets_metadata.py') }}

      - name: Setup uv with Python 3.12
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          activate-environment: true

      - name: Install dependencies
        run: uv sync

      - name: Layout repro digest (synthetic page, Δ=0)
        run: uv run python tests/repro/digest.py --golden tests/repro/golden/synth_layout.json
